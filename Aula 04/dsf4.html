<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: linear-gradient(to left, #ff8585, #85ffed, #d8ff7d) ;
            height: 100vh;
        }
        .caixa{

            height: 80vw;
            width: 30vw;
            max-height: 550px;
            max-width: 200px;

            margin: 0 auto;
            padding: 20px;
            background-color: rgb(137, 137, 137);

            border: 2px solid #5e5e5e;
            border-radius: 10px;
        }
        .circulo{
            
            height: 20vw;
            width: 20vw;
            max-height: 150px;
            max-width: 150px;

            margin: 20px auto;
            border-radius: 50%;
            border: 2px solid #606060;
            
        }
    </style>
</head>
<body>
    <div class="caixa">
        <div class="circulo" style="background-color: #ff8585;"></div>
        <div class="circulo" style="background-color: #dcff85;"></div>
        <div class="circulo" style="background-color: #b6ff85;"></div>
    </div>
</body>
</html>
